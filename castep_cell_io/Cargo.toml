[package]
name = "castep-cell-io"
version = "0.6.0"
edition = "2024"
authors = ["TonyWu20"]
description = "I/O library for CASTEP .cell and .param file formats"
readme = "README.md"
homepage = "https://github.com/TonyWu20/castep-cell-io"
repository = "https://github.com/TonyWu20/castep-cell-io"
license = "MIT"
keywords = ["castep", "chemistry"]

[dependencies]
bon = "3.9.1"
castep-cell-fmt = "0.2.1"
serde = { version = "1.0.219", features = ["derive"] }
